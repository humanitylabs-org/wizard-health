<!doctype html>
<html lang="en" data-app="wizard-health">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Health</title>
  <script src="boot.js"></script>
  <link rel="stylesheet" href="wizard-tokens.css">
  <!-- the shell's live tokens (success/warning roles the pinned snapshot predates); missing outside Wizard is fine -->
  <link rel="stylesheet" href="/wizard-os-home/kit/wizard-tokens.css">
  <link rel="stylesheet" href="wizard-ui.css">
  <link rel="stylesheet" href="standalone.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="/wizard-os-home/core/app-client.js"></script>
  <script defer src="wizard-sheet.js"></script>
  <script defer src="words.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="wz-app hl-app">
    <main class="wz-scroll hl-scroll" id="main">
      <!-- Nothing connected yet: one big button to the connector app (or each connector's setup link); Health never takes keys itself -->
      <section id="empty" class="hl-empty" hidden>
        <a class="hl-connect" id="connect" href="#">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 41s-15-8.6-15-20a8.5 8.5 0 0 1 15-5.5A8.5 8.5 0 0 1 39 21c0 11.4-15 20-15 20z"/><path d="M10 24h8l3-6 5 12 3-6h9"/></svg>
          <span>Connect a source</span>
        </a>
        <div class="hl-setups" id="setups" hidden></div>
        <i class="hl-wait" id="wait" hidden></i>
      </section>

      <section id="screen" class="hl-screen" hidden>
        <!-- The day shows only when a past day is picked, with one way back to today. The sources dot sits in the corner. -->
        <header class="hl-top">
          <div class="hl-when-row" id="when" hidden><span class="hl-day" id="date"></span><button type="button" class="hl-today" id="today">Back to today</button></div>
          <button type="button" class="hl-srcdot" id="srcdot" aria-label="Sources"><i></i></button>
        </header>
        <!-- Recovery, Sleep and Activity: all three side by side in a wide window, one at a time (picked in the bottom bar) in a
             narrow one. Each reads: title, a summary card coloured like the shown day's square, the graph. One legend under all three. -->
        <div class="hl-panels" id="panels">
          <article class="hl-panel" data-m="activity" aria-label="Activity"></article>
          <article class="hl-panel" data-m="recovery" aria-label="Recovery"></article>
          <article class="hl-panel" data-m="sleep" aria-label="Sleep"></article>
        </div>
        <!-- One legend for all three graphs: the same green / yellow / red everywhere, in plain words -->
        <p class="hl-legend" id="legend" role="img"></p>
      </section>
    </main>
    <!-- Narrow windows: the picker is a thumb bar at the bottom of the window, below the content (never over it) -->
    <nav class="hl-dock" id="dock" aria-label="Show" hidden>
      <div class="hl-seg" id="metric" role="radiogroup" aria-label="Show">
        <button type="button" role="radio" data-m="activity" aria-checked="true">Activity</button>
        <button type="button" role="radio" data-m="recovery" aria-checked="false">Recovery</button>
        <button type="button" role="radio" data-m="sleep" aria-checked="false">Sleep</button>
      </div>
    </nav>
    <p id="status" class="wz-status wz-sr" role="status" aria-live="polite"></p>
  </div>
  <!-- One metric: its title, the summary card for the shown day (filled with that day's square colour, the details
       baked in), then every day as a square (weeks are columns, Sunday to Saturday rows). Cloned into each panel above;
       ids are not used inside it. -->
  <template id="panel-tpl">
    <h2 class="hl-title"><span class="tname"></span> <span class="tgloss"></span><small class="tsub" hidden></small></h2>
    <section class="hl-focus" aria-live="polite">
      <div class="hl-fval"><b class="fnum"></b><small class="fof"></small><span class="hl-chip fchip" hidden></span></div>
      <div class="hl-abar fgoal" role="img" hidden><div class="hl-atrack"><i class="hl-azone"></i><i class="hl-amark"></i></div><div class="hl-aticks"></div></div>
      <p class="hl-say fsay"></p>
      <div class="hl-stbar fstages" role="img" hidden></div>
      <dl class="hl-kv fkv"></dl>
      <small class="hl-from ffrom" hidden></small>
      <button type="button" class="hl-expand fexp" aria-expanded="false">Details</button>
    </section>
    <section class="hl-graph" aria-label="Every day">
      <div class="hl-gwrap">
        <div class="hl-wd" aria-hidden="true"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>
        <div class="hl-gscroll">
          <div class="hl-gin">
            <div class="hl-months" aria-hidden="true"></div>
            <div class="hl-cells"></div>
          </div>
        </div>
      </div>
      <div class="hl-tip" role="status" hidden></div>
    </section>
  </template>
  <!-- The one pop-up: the sources list behind the corner dot -->
  <dialog class="wz-sheet hl-sheet" id="sheet" aria-labelledby="sheet-h"><div id="sheet-body"></div></dialog>
</body>
</html>
